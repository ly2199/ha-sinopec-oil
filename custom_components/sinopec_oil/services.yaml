record_refuel:
  name: 记录加油
  description: >-
    记录一次加油，自动按当日/历史油价智能计算加油量与费用，并更新油耗统计。
    智能计价：量+费用 → 单价=费用/量；只填量 → 费用=量×基准油价；
    只填费用 → 量=费用/基准油价（历史日期自动查询对应调价周期油价）。
    金额区分「加油费用」（挂牌价合计）与「实际支付」（真实付款），
    优惠金额 = 加油费用 - 实际支付，由本服务自动计算，无需手工填。
  fields:
    vehicle:
      name: 车辆
      description: 车辆名称/标识，用于区分多辆车（相同名称视为同一辆车）。
      required: true
      example: 我的 car
      selector:
        text:
    odometer:
      name: 里程表读数
      description: >-
        加油时的总里程表读数（公里）。留空仍可入库，只是相邻区间不参与油耗统计
        （记为缺口，不影响其他区间）；若填写，则需与相邻记录的里程同步递增、
        单区间不超过 900 km，否则视为时间-里程矛盾并被拒绝入库。
        卡片与内置填表会自动带出上次读数。
      required: false
      example: 12345
      selector:
        number:
          min: 0
          max: 10000000
          step: 0.1
          unit_of_measurement: km
          mode: box
    volume:
      name: 加油量
      description: 本次加注的燃油量（升）。未填时按费用与基准油价自动推算。
      required: false
      example: 40.5
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          unit_of_measurement: L
          mode: box
    total_cost:
      name: 加油费用
      description: >-
        本次加油的挂牌价合计（元），用于统计平均油价与每公里油费。
        未填时按加油量与基准油价自动计算；实际支付更低时系统会自动算出优惠。
      required: false
      example: 350.0
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          unit_of_measurement: 元
          mode: box
    actual_payment:
      name: 实际支付
      description: >-
        本次实际付款金额（元）。优惠金额 = 加油费用 - 实际支付，由服务自动计算；
        留空即视为无优惠（按加油费用全额支付）。只填实际支付时，加油费用按它取值，
        加油量按"费用 ÷ 基准油价"反算。
      required: false
      example: 300.0
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          unit_of_measurement: 元
          mode: box
    price:
      name: 油品单价
      description: 每升单价（元/L）。不填时自动引用当日（或历史日期的）油价。
      required: false
      example: 8.29
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
          unit_of_measurement: 元/L
          mode: box
    fuel_type:
      name: 油品类型
      description: >-
        油品类型，如 92、95、98、0#、-10、柴油、LNG；
        不填时使用车辆默认油品，再退回当前价表第一个油品。
      required: false
      example: "92"
      selector:
        text:
    date:
      name: 加油时间
      description: 加油时间，默认为当前时间。历史日期会自动匹配当时的调价周期油价。
      required: false
      selector:
        datetime:
    note:
      name: 备注
      description: 备注信息（油站、地点等）。
      required: false
      selector:
        text:
          multiline: true

import_refuel_records:
  name: 批量导入记录
  description: >-
    一次性导入多条历史加油记录（如从其他 App 迁移），导入后自动重算统计。
    每条同样区分加油费用与实际支付，优惠自动计算（实付留空即无优惠）。
  fields:
    vehicle:
      name: 车辆
      description: 记录归属的车辆名称/标识（不存在时自动创建）。
      required: true
      example: 我的 car
      selector:
        text:
    records:
      name: 记录列表
      description: >-
        记录数组，每条含 date、odometer、volume、total_cost、actual_payment、
        price、fuel_type、note（均可选，计价规则与"记录加油"一致）。
      required: true
      example:
        - date: "2026-08-01 10:00:00"
          odometer: 10000
          volume: 50
          total_cost: 414.5
          actual_payment: 380.0
        - date: "2026-08-15 10:00:00"
          odometer: 10600
          total_cost: 339.6
      selector:
        object:

add_vehicle:
  name: 添加车辆
  description: 注册一辆车并设置初始里程与默认油品。
  fields:
    vehicle:
      name: 车辆
      description: 新车辆的名称/标识。
      required: true
      example: 家里的 SUV
      selector:
        text:
    initial_odometer:
      name: 初始里程
      description: 开始记录时的里程表读数（公里），作为累计行驶里程的基准。
      required: false
      example: 12000
      selector:
        number:
          min: 0
          max: 10000000
          step: 0.1
          unit_of_measurement: km
          mode: box
    fuel_type:
      name: 默认油品
      description: 该车常用油品（如 92、95、0#），记录加油未指定油品时使用。
      required: false
      example: "92"
      selector:
        text:

remove_vehicle:
  name: 删除车辆
  description: 删除一辆车及其全部加油记录，对应统计实体将一并移除。
  fields:
    vehicle:
      name: 车辆
      description: 要删除的车辆名称/标识。
      required: true
      example: 我的 car
      selector:
        text:

clear_vehicle_data:
  name: 清空加油记录
  description: 清空某辆车的全部加油记录并重新计算统计（保留车辆本身）。
  fields:
    vehicle:
      name: 车辆
      description: 要清空记录的车辆名称/标识。
      required: true
      example: 我的 car
      selector:
        text:

refresh_oil_price:
  name: 刷新油价
  description: 立即从中石化网站刷新所有已配置位置的油价数据。

list_refuel_records:
  name: 查看加油记录
  description: >-
    按时间升序列出某辆车的全部加油记录（每条带 index 序号与计价来源），
    返回结果同时包含最新统计。index 用于 delete/edit_refuel_record 定位。
  fields:
    vehicle:
      name: 车辆
      description: 要查看记录的车辆名称/标识。
      required: true
      example: 我的 car
      selector:
        text:

delete_refuel_record:
  name: 删除加油记录
  description: 按序号删除一条加油记录，统计随之重算。序号可先用"查看加油记录"获取。
  fields:
    vehicle:
      name: 车辆
      description: 记录所属的车辆名称/标识。
      required: true
      example: 我的 car
      selector:
        text:
    index:
      name: 记录序号
      description: 要删除的记录序号（"查看加油记录"返回的 index，从 0 开始，按日期升序）。
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 100000
          mode: box

edit_refuel_record:
  name: 修改加油记录
  description: >-
    按序号修改一条加油记录，只填要改的字段。智能重算：只改加油量 → 按记录日期
    的油价重算加油费用（原优惠金额保留）；只改加油费用 → 反算加油量（原优惠保留）；
    量与费同时给 → 单价=费用/加油量，未给实际支付则视为无优惠；
    只改实际支付 → 加油费用不变，优惠随之变化。
  fields:
    vehicle:
      name: 车辆
      description: 记录所属的车辆名称/标识。
      required: true
      example: 我的 car
      selector:
        text:
    index:
      name: 记录序号
      description: 要修改的记录序号（"查看加油记录"返回的 index）。
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    odometer:
      name: 里程表读数
      description: 修改为该里程表读数（公里）。不填则保持不变。
      required: false
      selector:
        number:
          min: 0
          max: 10000000
          step: 0.1
          unit_of_measurement: km
          mode: box
    volume:
      name: 加油量
      description: 修改为该加油量（升）。只填此项时按记录日期油价重算加油费用。
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          unit_of_measurement: L
          mode: box
    total_cost:
      name: 加油费用
      description: >-
        修改为挂牌价合计（元）。只填此项时按记录日期油价反算加油量；
        未同时给出实际支付时，优惠金额沿用原记录的优惠。
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          unit_of_measurement: 元
          mode: box
    actual_payment:
      name: 实际支付
      description: >-
        修改为实际付款金额（元）。优惠 = 加油费用 - 实际支付，自动重算；
        留空且同时给了加油费用时视为无优惠。高于加油费用会被拒绝。
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          unit_of_measurement: 元
          mode: box
    price:
      name: 油品单价
      description: 直接指定单价（元/L）覆盖自动计算。
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
          unit_of_measurement: 元/L
          mode: box
    date:
      name: 加油时间
      description: 修改加油时间。时间变更后按新日期重新匹配历史油价。
      required: false
      selector:
        datetime:
    note:
      name: 备注
      description: 修改备注。
      required: false
      selector:
        text:

get_price_history:
  name: 查询历史油价
  description: >-
    返回当前配置位置（省份/价区）的历史调价周期列表（约 24 期 ≈ 11 个月），
    每期含起止日期与各油品价格。也可直接查看"油价更新时间"传感器的
    price_history 属性。

