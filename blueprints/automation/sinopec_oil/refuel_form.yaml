blueprint:
  name: 中石化油价 · 加油记录填表
  description: >-
    通过输入助手（helper）填表记录加油，提交后自动按当日/历史油价智能计算
    加油量与费用，并清空表单。

    前置准备（设置 → 设备与服务 → 助手 → 创建助手）：
    1. 文本：车辆名称（如 input_text.sinopec_vehicle）
    2. 数字：里程表读数 km（input_number.sinopec_odometer，最小 0）
    3. 数字：加油量 L（input_number.sinopec_volume，最小 0，可选填）
    4. 数字：加油费用 元（input_number.sinopec_cost，最小 0，可选填）
    5. 文本：油品类型（input_text.sinopec_fuel，填 92/95/0# 等，可选）
    6. 文本：备注（input_text.sinopec_note，可选）
    7. 按钮：提交加油记录（input_button.sinopec_submit）

    使用：填好车辆名称、里程，加油量或费用至少填一项 → 按提交按钮。
    只填加油量 → 自动算费用；只填费用 → 自动算加油量；
    都不填 → 按油价估算"约值"。提交后加油量/费用/里程/备注自动清零。
  domain: automation
  author: sinopec_oil
  input:
    vehicle_helper:
      name: 车辆名称助手（文本）
      selector:
        entity:
          filter:
            - domain: input_text
    odometer_helper:
      name: 里程表读数助手（数字）
      selector:
        entity:
          filter:
            - domain: input_number
    volume_helper:
      name: 加油量助手（数字，可选填）
      selector:
        entity:
          filter:
            - domain: input_number
    cost_helper:
      name: 加油费用助手（数字，可选填）
      selector:
        entity:
          filter:
            - domain: input_number
    fuel_helper:
      name: 油品类型助手（文本，可选）
      selector:
        entity:
          filter:
            - domain: input_text
    note_helper:
      name: 备注助手（文本，可选）
      selector:
        entity:
          filter:
            - domain: input_text
    submit_helper:
      name: 提交按钮助手（按钮）
      selector:
        entity:
          filter:
            - domain: input_button
mode: single
trigger:
  - platform: state
    entity_id: !input submit_helper
condition:
  - condition: template
    value_template: >
      {{ has_value(trigger.to_state.entity_id) }}
action:
  - service: sinopec_oil.record_refuel
    data:
      vehicle: "{{ states(vehicle_helper) | trim }}"
      odometer: >-
        {% if has_value(odometer_helper) and states(odometer_helper) | float(0) > 0 %}
          {{ states(odometer_helper) | float }}
        {% else %}
          {{ none }}
        {% endif %}
      volume: >-
        {% if has_value(volume_helper) and states(volume_helper) | float(0) > 0 %}
          {{ states(volume_helper) | float }}
        {% else %}
          {{ none }}
        {% endif %}
      total_cost: >-
        {% if has_value(cost_helper) and states(cost_helper) | float(0) > 0 %}
          {{ states(cost_helper) | float }}
        {% else %}
          {{ none }}
        {% endif %}
      fuel_type: "{{ states(fuel_helper) | trim if has_value(fuel_helper) else none }}"
      note: "{{ states(note_helper) | trim if has_value(note_helper) else none }}"
  - service: input_number.set_value
    target:
      entity_id: !input odometer_helper
    data:
      value: 0
  - service: input_number.set_value
    target:
      entity_id: !input volume_helper
    data:
      value: 0
  - service: input_number.set_value
    target:
      entity_id: !input cost_helper
    data:
      value: 0
  - service: input_text.set_value
    target:
      entity_id: !input note_helper
    data:
      value: ""
